name: Java CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
          cache: maven

      - name: Show Java and Maven versions
        run: mvn --version

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test -DfailIfNoTests=true